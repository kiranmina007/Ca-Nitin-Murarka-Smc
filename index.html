  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;

    body {

    .page {

      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    }

    .card {

      align-items: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.16);
      overflow: hidden;
    }

    .top {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 24px;
    }

    .logo-wrap {
      width: 128px;
      height: 128px;
      overflow: hidden;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
      flex-shrink: 0;
    }

    .logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin: 20px 0 0;
      text-align: center;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      color: #212121;
    }

    .telegram-label {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #707579;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .telegram-icon {
      width: 16px;
      height: 16px;
      color: #54a9eb;
      fill: currentColor;
    }

    .welcome {
      margin: 16px 0 0;
      text-align: center;
      color: #4b4f52;
      font-size: 15px;
      line-height: 22px;
      font-weight: 500;
    }

    .insight {
      margin: 6px 0 0;
      text-align: center;
      color: #54a9eb;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #eaeaea;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 28px 24px;
    }

    .join-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #54a9eb;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      transition: background .2s ease, transform .1s ease;
    }

    .join-btn:hover {
      background: #3d97dc;
    }

    .join-btn:active {
      background: #3488cc;
      transform: scale(.99);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      line-height: 20px;
    }

    footer a {
      color: #fff;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.6);
      text-underline-offset: 2px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 14px;
      }

      .card {
        max-width: 420px;
      }

      .top {

      }
    }
